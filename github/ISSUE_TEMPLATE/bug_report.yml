name: 🐞 Bug report
description: Something looks wrong or doesn't work
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Tip: **Help → Report a Bug…** inside the app pre-fills the diagnostics for you.
  - type: input
    id: car
    attributes:
      label: Car
      description: Series, body style and engine (e.g. "1 Series Coupé 120d")
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: View
      options: [Front, Side, Rear, Interior, Panorama, Not a rendering issue]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the options you had selected if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose …
        2. Select …
        3. Switch to …
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here, it helps a lot with visual bugs.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste from **Help → Copy Diagnostic Info**.
      render: text
    validations:
      required: true
